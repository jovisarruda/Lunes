<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunes</title><!-- v3.2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f6f7;--panel:#fff;--border:#d5d9e2;--text:#1d1f28;--muted:#7d8296;
  --accent:#4f6ef7;--accent-soft:#eef1fe;--danger:#e2445c;--ok:#00c875;--green:#00a97a;--green-soft:#e6f6f0;
  --r:8px;font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{padding:7px 14px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--text);background:var(--accent-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.icon-btn{padding:6px;border-radius:6px;color:var(--muted);line-height:1}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}

/* login */
#login{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}
#login .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px;width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(30,40,90,.06)}
.logo{font-size:26px;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--green)}
#loginErr{color:var(--danger);font-size:12.5px;min-height:16px}

/* layout */
#app{display:none;height:100vh;height:100dvh;flex-direction:row}
#sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:4px;flex-shrink:0}
#sidebar .logo{padding:4px 10px 14px}
.bnav{padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:8px;color:var(--text);width:100%;text-align:left;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bnav:hover{background:var(--green-soft)}
.bnav.active{background:var(--green-soft);color:var(--green);font-weight:600;box-shadow:inset 3px 0 0 var(--green)}
#sidebar.min{width:58px;padding:14px 5px}
#sidebar.min .logo{font-size:20px;padding:4px 0 14px;text-align:center}
.rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.rz:hover{background:var(--green);opacity:.5}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
#boardTitle{font-size:19px;font-weight:700;margin-right:6px}
.test-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;color:#fff;background:#e2445c;padding:1px 7px;border-radius:10px;vertical-align:middle;margin-left:2px}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:7px;padding:3px}
.tabs button{padding:5px 12px;border-radius:5px;color:var(--muted);font-weight:500}
.tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
#topRight{margin-left:auto;display:flex;align-items:center;gap:8px}
#bell{position:relative}
#bellCount{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700;display:none}
#viewMenuBtn,#toolsMenuBtn{display:none}
#toolsBellCount{color:var(--danger);font-weight:700;font-size:11px;margin-left:3px}

/* filter bar */
#filterbar{display:flex;gap:8px;align-items:center;padding:10px 20px;flex-wrap:wrap}
#filterbar input,#filterbar select{font-size:13px;padding:5px 8px}
#content{flex:1;overflow:auto;padding:0 20px 40px}

/* table view */
.group{margin-top:22px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.group-head h3{font-size:15.5px;cursor:pointer}
.gtable{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gtable{border:1px solid var(--border)}
.gtable th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);border-right:1px solid #e8eaf1;background:#f6faf8;white-space:nowrap;overflow:hidden}
.gtable td{padding:5px 10px;border-bottom:1px solid var(--border);border-right:1px solid #eceef4;vertical-align:middle;overflow:hidden}
.gtable tr:last-child td{border-bottom:none}
.gtable tr.item:hover{background:#fafbff}
.iname{display:flex;align-items:center;gap:6px;font-weight:500;overflow:hidden}
.iname .exp{width:18px;color:var(--muted);flex-shrink:0}
.iname .nm{cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iname .nm:hover{color:var(--accent);text-decoration:underline}
.subrow{background:#fbfbfd}
.subhead td{font-size:11.5px;color:var(--muted);background:#f4f5fa;padding:4px 10px}
.subwrap>td{padding:4px 0 8px 38px;background:#fbfbfd}
.subtable{background:#fbfbfd}
.subtable th{background:#f4f5fa;font-size:11.5px}
.nm-edit{opacity:0;padding:1px 4px;font-size:12px;flex-shrink:0;border-radius:4px;color:var(--muted);transition:opacity .12s}
.nm-edit:hover{background:var(--accent-soft);color:var(--accent)}
.iname:hover .nm-edit{opacity:1}
.cellv{display:inline-block;min-width:40px;min-height:18px;cursor:pointer;border-radius:4px;padding:2px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cellv:hover{outline:1px solid var(--border)}
.status-chip{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;border-radius:4px;padding:3px 10px;min-width:86px;cursor:pointer;text-align:center}
.sumrow td{font-size:12px;color:var(--muted);background:#fafbfe;font-weight:600}
.addrow{color:var(--muted);font-size:13px;cursor:pointer}
.addrow:hover{color:var(--accent)}
.gsum{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}

/* Proporção retrato/quadrada (largura <= altura), em qualquer aparelho: compacta um pouco
   a barra superior, filtros e a TABELA (itens padrão) para melhorar a visualização.
   Não altera o Gantt (nada aqui usa as classes do gantt). */
@media (max-aspect-ratio: 1/1){
  #topbar{padding:8px 10px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:30;flex-shrink:0}
  #boardTitle{font-size:16px}
  /* junta as abas num só botão-menu e os ícones (filter/columns/automate/sino) noutro */
  .tabs{display:none}
  #topRight > button:not(#toolsMenuBtn){display:none}
  #viewMenuBtn,#toolsMenuBtn{display:inline-flex}
  #topRight{gap:6px}
  #filterbar{padding:8px 10px;gap:6px}
  #filterbar input,#filterbar select{font-size:12px;padding:4px 6px}
  #content{padding:0 8px 40px}
  .group{margin-top:16px}
  .group-head h3{font-size:14px}
  .gtable th{padding:5px 6px;font-size:11px}
  .gtable td{padding:4px 6px;font-size:12.5px}
  .gtable .status-chip{min-width:52px;font-size:11px;padding:2px 6px}
  .gtable .cellv{min-width:26px;padding:1px 3px}
  .gtable .iname{gap:4px}
  .gtable .iname .exp{width:14px}
  .gtable .icon-btn,.group-head .icon-btn{font-size:13px;padding:2px}
  .subwrap>td{padding-left:16px}
  .subhead td,.subtable th{font-size:11px;padding:4px 6px}
}

/* kanban */
#kanban{display:flex;gap:14px;align-items:flex-start;padding-top:18px;overflow-x:auto}
.kcol{background:#eef0f6;border-radius:10px;min-width:250px;width:250px;padding:10px;flex-shrink:0}
.kcol h4{font-size:13px;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.kdot{width:10px;height:10px;border-radius:3px;display:inline-block}
.kcard{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.07);cursor:grab;font-size:13px}
.kcard .kb{color:var(--muted);font-size:11.5px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.kcol.dragover{outline:2px dashed var(--accent)}

/* calendar */
#calendar{padding-top:14px}
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.calhead h3{font-size:16px;min-width:150px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.caldow{background:#fafbfe;padding:6px;font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.calday{background:#fff;min-height:96px;padding:4px;font-size:12px}
.calday.dim{background:#fafafa;color:#c0c3d0}
.calday.today .dnum{background:var(--accent);color:#fff}
.dnum{display:inline-flex;width:22px;height:22px;border-radius:11px;align-items:center;justify-content:center;font-weight:600;margin-bottom:3px}
.calev{border-radius:4px;color:#fff;padding:2px 5px;font-size:11px;margin-bottom:2px;cursor:grab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calday.dragover{outline:2px dashed var(--accent);outline-offset:-2px}

/* modal & panel */
.overlay{position:fixed;inset:0;background:rgba(25,28,40,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:12px;padding:22px;width:520px;max-width:94vw;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:95vw;background:#fff;border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.08);z-index:40;display:flex;flex-direction:column}
#panelHead{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#panelBody{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.ptabs{display:flex;gap:14px;border-bottom:1px solid var(--border);padding:0 18px}
.ptabs button{padding:9px 2px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.ptabs button.active{color:var(--accent);border-color:var(--accent)}
.comment{background:#f7f8fc;border-radius:8px;padding:9px 11px;font-size:13px}
.comment .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.logline{font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--border)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip button{color:inherit;opacity:.6}
.small{font-size:12px;color:var(--muted)}
.autorule{border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
hr{border:none;border-top:1px solid var(--border)}
.menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:60;min-width:160px;padding:4px;display:flex;flex-direction:column}
.menu button{text-align:left;padding:7px 10px;border-radius:5px;font-size:13px}
.menu button:hover{background:var(--accent-soft)}
.menu button.danger{color:var(--danger)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22242e;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:99;display:none}
/* Fase 1: drag reorder + batch select */
.drag{cursor:grab;color:var(--muted);opacity:.4;font-size:12px;padding:0 1px;user-select:none;flex-shrink:0}
.drag:hover{opacity:.95}
.drag:active{cursor:grabbing}
.selbox{cursor:pointer;flex-shrink:0;margin:0 1px}
tr.dragrow>td{box-shadow:inset 0 2px 0 0 var(--accent)}
#batchbar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#22242e;color:#fff;padding:8px 12px;border-radius:10px;display:flex;gap:8px;align-items:center;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.28);font-size:13px}
#batchbar .btn{padding:5px 11px}
tr.ghost>td{opacity:.5;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(79,110,247,.045) 6px,rgba(79,110,247,.045) 12px)}
tr.ghost .nm{font-style:italic}
.pendtag{background:var(--accent-soft);color:var(--accent);border-radius:8px;font-size:10px;padding:1px 6px;font-weight:700;margin-left:4px;white-space:nowrap}
#tab-aiinput{font-weight:600}
.aimsg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
#aiFab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(79,110,247,.4);z-index:85;cursor:pointer;border:none}
#aiFab:hover{filter:brightness(1.08)}
#aiChat{position:fixed;bottom:84px;right:22px;width:380px;max-width:92vw;height:520px;max-height:74vh;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:85;display:none;flex-direction:column;overflow:hidden}
#aiChat.open{display:flex}
#aiChatHead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600}
#aiBody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.aimsg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.aimsg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:3px}
.aimsg.typing{opacity:.6;font-style:italic}
#aiFoot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end}
#aiInput{flex:1;resize:none;height:40px;max-height:110px;font-size:13px}
/* ===== B4 — LunesGantt (Gantt + Workload) ===== */
.gwrap{display:flex;flex-direction:column;height:calc(100vh - 120px)}
.gtool{display:flex;align-items:center;gap:10px;padding:6px 2px;flex-wrap:wrap}
.gseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.gseg button{border:0;background:#fff;padding:5px 11px;font:inherit;cursor:pointer;color:var(--muted)}
.gseg button.on{background:var(--accent,#00854d);color:#fff}
.gboard{flex:1;overflow:auto;border:1px solid var(--border);border-radius:10px;position:relative;background:#fff}
.ghead{position:sticky;top:0;z-index:6;display:flex;height:46px;background:#fff;border-bottom:1px solid var(--border)}
.gcorner{position:sticky;left:0;z-index:7;width:var(--gtw,460px);flex:0 0 var(--gtw,460px);background:#fff;border-right:1px solid var(--border);display:flex;align-items:flex-end}
.gcorner .gc{display:flex;width:100%;padding:0 8px 6px;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.gth{position:relative;flex:0 0 auto;height:46px}
.gtt{position:absolute;top:0;height:22px;display:flex;align-items:center;padding-left:6px;font-size:11px;color:#555;font-weight:600;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden}
.gtb{position:absolute;top:22px;height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);border-left:1px solid #eef1f3}
.gtb.wk{background:#f4f6f8}
.grow{display:flex;height:32px;position:relative}
.grow:hover .gtc{background:#f7f9fa}
.gtc{position:sticky;left:0;z-index:5;width:var(--gtw,460px);flex:0 0 var(--gtw,460px);background:#fff;border-right:1px solid var(--border);border-bottom:1px solid #eef1f3;display:flex;align-items:center;gap:4px;padding:0 8px;overflow:hidden}
.gtc .gid{width:34px;flex:0 0 34px;text-align:right;color:#9aa;font-size:11px;font-variant-numeric:tabular-nums}
.gtc .gcar{width:16px;flex:0 0 16px;text-align:center;cursor:pointer;color:#aab}
.gtc .gnm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtc .gpr{width:70px;flex:0 0 70px;color:#667;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtc.lv0 .gnm{font-weight:700}.gtc.lv1 .gnm{font-weight:600}
.gtrack{position:relative;flex:0 0 auto;border-bottom:1px solid #eef1f3}
.gcol{position:absolute;top:0;bottom:0;border-left:1px solid #eef1f3}.gcol.mo{border-left:1px solid var(--border)}.gcol.wk{border:0;background:rgba(140,150,160,.05)}
.gbar{position:absolute;height:17px;top:7px;border-radius:5px;background:var(--accent,#00854d);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:2;display:flex;align-items:center}
.gbar .gh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}.gbar .gh.l{left:-1px}.gbar .gh.r{right:-1px}
.gsum{height:8px;top:12px;background:#7c858e;border-radius:2px;box-shadow:none;cursor:default}
.gsum::before,.gsum::after{content:"";position:absolute;top:100%;border-top:5px solid #7c858e;width:0;height:0}.gsum::before{left:0;border-right:5px solid transparent}.gsum::after{right:0;border-left:5px solid transparent}
.gms{position:absolute;width:13px;height:13px;top:9px;background:#5b6570;transform:rotate(45deg);border-radius:2px;cursor:grab;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.glab{position:absolute;left:calc(100% + 16px);white-space:nowrap;color:var(--muted);font-size:11px;pointer-events:none}
.gdot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent,#00854d);top:11px;cursor:crosshair;opacity:0;z-index:4}
.grow:hover .gdot{opacity:.85}
.gov{position:absolute;top:0;left:0;pointer-events:none;z-index:3}
.gov path.dep{fill:none;stroke:#5b6570;stroke-width:1.5;pointer-events:stroke;cursor:pointer}.gov path.dep:hover{stroke:var(--accent,#00854d);stroke-width:2.2}
.gvl{stroke-dasharray:4 3;stroke-width:2}
table.wlt{border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.wlt th,table.wlt td{border:1px solid var(--border);padding:6px 10px;text-align:center;white-space:nowrap}
table.wlt th{background:#f7f9fa;color:#556}
table.wlt td.pn,table.wlt th:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:#fff}
table.wlt th:first-child{background:#f7f9fa}
table.wlt td.over{background:#fdecef;color:#b02a3c;font-weight:600}
#gtip{position:fixed;z-index:50;background:#2b3033;color:#fff;padding:3px 7px;border-radius:5px;font-size:11px;pointer-events:none;display:none}
.gbar.crit{outline:2px solid #e2445c;outline-offset:1px}
.gms.crit{outline:2px solid #e2445c}
.gov path.dep.crit{stroke:#e2445c;stroke-width:2}
.gaff{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #eef1f3;font-size:12.5px}
.gaff .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaff .dt{color:var(--muted);font-variant-numeric:tabular-nums}
.gaff .d{font-size:10px;padding:1px 6px;border-radius:10px;background:#eef1f3;color:#556;white-space:nowrap}
.gaff .d.later{background:#fff2e0;color:#b5710f}.gaff .d.earlier{background:#e7eefc;color:#33559e}
.gwarn{margin:6px 0;padding:8px 10px;border-radius:8px;background:#fdecef;color:#b02a3c;font-size:12.5px}
.gwarn.k{background:#eafaf1;color:#177a4d}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">Lu<span>nes</span></div>
    <input id="lEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
    <div id="loginErr"></div>
    <button class="btn" id="lBtn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div style="display:flex;align-items:center">
      <div class="logo" id="logoTxt">Lu<span>nes</span></div>
      <div style="flex:1" id="logoSp"></div>
      <button class="icon-btn" id="navTgl" onclick="toggleNav()" title="Collapse sidebar">«</button>
    </div>
    <div id="boardList"></div>

async function addDep(fromId,toId,type,lag){
  if(!fromId||!toId||fromId===toId)return;
  if(links.some(l=>l.from_item===fromId&&l.to_item===toId))return;
  const {data,error}=await sb.from('links').insert({board_id:curBoard.id,from_item:fromId,to_item:toId,type:type||'FS',lag:lag||0}).select().single();
  if(error)return toast(error.message);

}
async function removeDep(id){await sb.from('links').delete().eq('id',id);links=links.filter(l=>l.id!==id)}
async function setDepType(id,type){const l=links.find(x=>x.id===id);if(!l)return;l.type=type;await sb.from('links').update({type}).eq('id',id)}
// parse "1FS; 10SS" (default FS) and sync a project item's incoming links to it
async function setPredecessors(it,text){
  const entries=String(text==null?'':text).split(/[;,]/).map(s=>s.trim()).filter(Boolean);
  const want=[];const errors=[];
  for(const e of entries){const m=e.match(/^(\d+)\s*(FS|SS|FF|SF)?$/i);if(!m){errors.push(e);continue}
    const src=itemByCode(+m[1]);if(!src){errors.push(e+' (no ID)');continue}if(src.id===it.id){errors.push(e+' (self)');continue}
    want.push({from:src.id,type:(m[2]||'FS').toUpperCase()})}
  const current=depsOf(it.id);
  for(const l of current)if(!want.some(w=>w.from===l.from_item&&w.type===l.type))await removeDep(l.id);
  for(const w of want)if(!links.some(l=>l.from_item===w.from&&l.to_item===it.id))await addDep(w.from,it.id,w.type);
  if(errors.length)toast('Ignored: '+errors.join(', '));
  renderView();if(panelItem===it.id)renderPanel();
}

/* ===== CSV EXPORT (whole board: groups, items, subitems) ===== */
function csvEsc(v){v=(v==null?'':String(v));return /[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvCell(it,col){
  const p=(typeof numPair==='function')?numPair():null;
  if(col.type==='number'&&p&&col.id===valueColId(it)){const ss=subSum(it);if(ss!=null)return ss}
  const v=it.col_values?.[col.id];return v==null?'':v;
}
function exportBoardCSV(){
  if(!curBoard)return;
  const ic=itemCols(),sc=subCols();
  const head=['Group','Level','Name',...ic.map(c=>'I: '+c.name),...sc.map(c=>'S: '+c.name)];
  const rows=[head];
  for(const g of groups){
    for(const it of topItems().filter(x=>x.group_id===g.id&&!isPending(x))){
      rows.push([g.name,'Item',it.name,...ic.map(c=>csvCell(it,c)),...sc.map(()=>'')]);
      for(const s of subsOf(it.id).filter(x=>!isPending(x)))rows.push([g.name,'Subitem',s.name,...ic.map(()=>''),...sc.map(c=>csvCell(s,c))]);
    }
  }
  const csv=rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(curBoard.name.replace(/[^\w]+/g,'_').replace(/^_+|_+$/g,'')||'board')+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('CSV exported');
}

async function setCell(itemId,colId,val){
  const it=items.find(x=>x.id===itemId);const col=cols.find(c=>c.id===colId);
  const old=it.col_values[colId]??'';
  if(String(old)===String(val))return renderView();
  const p=typeof numPair==='function'?numPair():null;
  if(p&&col&&col.id===valueColId(it)){
    // editing the value column of a node that has children
    if(liveKids(it).length){
      if(window._forceManual===it.id){          // user chose to override the Σ with a manual value
        window._forceManual=null;
        await clearSumSubtree(it);               // wipe every value below in the subtree
        it.col_values={...it.col_values,_manualSum:true};
      }else if(!it.col_values._manualSum){
        return renderView();                     // computed (Σ) cell: ignore stray edits
      }
    }
    // reverse case: entering a value here while an ANCESTOR is a manual override → resume summing there
    if(val!==''&&val!=null){
      let anc=items.find(x=>x.id===it.parent_id);
      while(anc){
        if(anc.col_values._manualSum){
          if(!confirm('An item above has a manual value.\nEntering a value here will DELETE that manual value and resume summing. Continue?'))return renderView();
          const avc=valueColId(anc);const acv={...anc.col_values};delete acv._manualSum;if(avc)acv[avc]='';
          anc.col_values=acv;await sb.from('items').update({col_values:acv}).eq('id',anc.id);
          break;
        }
        anc=items.find(x=>x.id===anc.parent_id);
      }
    }
  }
  it.col_values={...it.col_values,[colId]:val};
  await updateItem(it,{col_values:it.col_values},col.name,old,val);
  if(col.type==='status'&&!isPending(it))runAutomations('status_changes',it,{colId,value:val});
  renderView();if(panelItem===itemId)renderPanel();
}

  if(!confirm('Delete "'+it.name+'"'+(kids.length?' and its '+kids.length+' sub-element(s)':'')+'?'))return;
  const ids=[id,...kids];
  await sb.from('items').delete().in('id',ids);

  links=links.filter(l=>!ids.includes(l.from_item)&&!ids.includes(l.to_item)); // B2 (DB cascades; keep local in sync)
  renderView();
}

/* ================= FILTERS ================= */
let filters={search:'',cols:{}};
function fBadge(){const n=Object.keys(filters.cols).length+(filters.search?1:0);const b=$('fBadge');if(b)b.textContent=n?' ('+n+')':''}
function passFilter(it){
  const q=(filters.search||'').toLowerCase();
  if(q&&!(it.name.toLowerCase().includes(q)||Object.values(it.col_values||{}).some(v=>String(v).toLowerCase().includes(q))))return false;
  const isSub=!!it.parent_id;
  for(const cid in filters.cols){
    const f=filters.cols[cid];const col=cols.find(c=>c.id===cid);
    if(!col||f==null||f==='')continue;
    if((col.scope==='subitem')!==isSub)continue; // filter only applies to its scope
    const v=it.col_values[cid];
    if(col.type==='number'){
      const n=parseFloat(v);
      if(f.min!=null&&f.min!==''&&!(n>=parseFloat(f.min)))return false;
      if(f.max!=null&&f.max!==''&&!(n<=parseFloat(f.max)))return false;
    }else if(col.type==='date'){
      if(f.from&&!(v&&v>=f.from))return false;
      if(f.to&&!(v&&v<=f.to))return false;
    }else if(col.type==='checkbox'){
      if(f==='checked'&&!v)return false;
      if(f==='unchecked'&&v)return false;
    }else if(col.type==='status'||col.type==='person'||col.type==='label'){
      if(String(v||'')!==f)return false;
    }else{
      if(!String(v||'').toLowerCase().includes(String(f).toLowerCase()))return false;
    }
  }
  return true;
}
function setFilter(id,v){if(v)filters.cols[id]=v;else delete filters.cols[id];renderView();fBadge()}
function setFilterObj(id,k,v){const f=filters.cols[id]||(filters.cols[id]={});f[k]=v;if(!f.from&&!f.to&&!f.min&&!f.max)delete filters.cols[id];renderView();fBadge()}
function filterCtl(c){
  const f=filters.cols[c.id];
  if(c.type==='status'||c.type==='person'||c.type==='label'){
    const opts=c.type==='status'?(c.options.labels||[]).map(l=>l.name):(c.options.choices||[]);
    return `<select onchange="setFilter('${c.id}',this.value)"><option value="">all</option>${opts.map(o=>`<option ${f===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(c.type==='date')return `<input type="date" value="${(f&&f.from)||''}" onchange="setFilterObj('${c.id}','from',this.value)"> <span class="small">to</span> <input type="date" value="${(f&&f.to)||''}" onchange="setFilterObj('${c.id}','to',this.value)">`;
  if(c.type==='number')return `<span class="small">min</span> <input type="number" style="width:90px" value="${(f&&f.min)??''}" onchange="setFilterObj('${c.id}','min',this.value)"> <span class="small">max</span> <input type="number" style="width:90px" value="${(f&&f.max)??''}" onchange="setFilterObj('${c.id}','max',this.value)">`;
  if(c.type==='checkbox')return `<select onchange="setFilter('${c.id}',this.value)"><option value="">all</option><option value="checked" ${f==='checked'?'selected':''}>checked</option><option value="unchecked" ${f==='unchecked'?'selected':''}>unchecked</option></select>`;
  return `<input value="${esc(typeof f==='string'?f:'')}" placeholder="contains…" oninput="setFilter('${c.id}',this.value)">`;
}
function openFilters(){
  overlay(`<h3>⚲ Filters — ${esc(curBoard.name)}</h3>
    <div class="row"><span class="small" style="width:120px">Search</span><input value="${esc(filters.search)}" style="flex:1" oninput="filters.search=this.value;renderView();fBadge()"></div>
    <b class="small">ITEM COLUMNS</b>
    ${itemCols().map(c=>`<div class="row"><span class="small" style="width:120px">${esc(c.name)}</span>${filterCtl(c)}</div>`).join('')||'<p class="small">—</p>'}
    <b class="small">SUBITEM COLUMNS</b>

    <button class="btn sm ghost" style="align-self:flex-start" onclick="filters={search:'',cols:{}};renderView();fBadge();this.closest('.overlay').remove();openFilters()">Clear all</button>`);

// subitem-scoped filters also hide items that have no matching subitem
const subFiltersActive=()=>Object.keys(filters.cols).some(id=>{const c=cols.find(x=>x.id===id);return c&&c.scope==='subitem'&&filters.cols[id]!==''&&filters.cols[id]!=null});
const itemVisible=it=>passFilter(it)&&(!subFiltersActive()||subsOf(it.id).some(passFilter));

/* ===== Fase B (Etapa 1): recursive bottom-up sum on the primary value pair =====
   The value column of a node is the FIRST number column of its scope: item→p.i, subitem→p.s
   (positional pairing, so "Total"(item) sums "Price"(subitem) regardless of name).
   By default any node WITH children sums them, recursively through all nesting levels.
   A node can be manually overridden (reserved flag col_values._manualSum) — same pattern
   as _pending/_proposed. Overriding a node deletes the values of its whole subtree. */
function numPair(){const i=itemCols().find(c=>c.type==='number');const s=subCols().find(c=>c.type==='number');return (i&&s)?{i,s}:null}
function valueColId(node){const p=numPair();if(!p)return null;return node.parent_id?p.s.id:p.i.id}
function liveKids(node){return subsOf(node.id).filter(s=>!isPending(s))}
// effective numeric value of one node on its value column (manual/leaf value OR recursive sum of children)
function nodeEff(node){
  const vc=valueColId(node);if(!vc)return null;
  const kids=liveKids(node);
  if(kids.length&&!node.col_values._manualSum)return nodeSum(node);
  const v=node.col_values[vc];return (v===''||v==null)?null:(parseFloat(v)||0);
}
// sum of a node's direct children's effective values (null if none contribute)
function nodeSum(node){
  const kids=liveKids(node);if(!kids.length)return null;
  let t=null;for(const k of kids){const kv=nodeEff(k);if(kv!=null)t=(t||0)+kv}
  return t;
}
// display sum for an auto-summing node (null when it has no children or is a manual override)
function subSum(it){
  const kids=liveKids(it);
  if(!kids.length||it.col_values._manualSum)return null;
  return nodeSum(it);
}
function effNum(it,col){
  const p=numPair();
  if(p&&col.id===valueColId(it)){const ss=subSum(it);if(ss!=null)return ss}
  return parseFloat(it.col_values[col.id])||0;
}
// user clicked a computed (Σ) cell to type a manual value instead
function forceManual(e,itemId,colId){
  if(!confirm('This value is the sum of the items below it.\nTyping a manual value will STOP summing and DELETE the values below. Continue?'))return;
  window._forceManual=itemId;
  editCell(e,itemId,colId);
}
// clear the value column + manual flag across an entire subtree (used when forcing a manual value up top)
async function clearSumSubtree(node){
  for(const k of subsOf(node.id)){
    const kvc=valueColId(k); // each child clears ITS OWN value column (subitem scope), not the parent's
    const cv={...k.col_values};let ch=false;
    if(kvc&&cv[kvc]!=null&&cv[kvc]!==''){cv[kvc]='';ch=true}
    if(cv._manualSum){delete cv._manualSum;ch=true}
    if(ch){k.col_values=cv;await sb.from('items').update({col_values:cv}).eq('id',k.id)}
    await clearSumSubtree(k);
  }
}
// undo a manual override: clear the flag+value so the node resumes summing its children
async function resumeSum(itemId){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  const vc=valueColId(it);const cv={...it.col_values};
  delete cv._manualSum;if(vc)cv[vc]='';
  it.col_values=cv;await sb.from('items').update({col_values:cv}).eq('id',it.id);
  renderView();if(panelItem===itemId)renderPanel();
}

/* ---- cell rendering & editing ---- */
function cellHtml(it,col){
  const v=it.col_values[col.id];
  if(col.type==='status'){
    const lbl=(col.options.labels||[]).find(l=>l.name===v);
    return `<span class="status-chip" style="background:${lbl?lbl.color:'#c4c4c4'}" onclick="statusMenu(event,'${it.id}','${col.id}')">${esc(v||'—')}</span>`;
  }
  if(col.type==='checkbox')return `<input type="checkbox" ${v?'checked':''} onchange="setCell('${it.id}','${col.id}',this.checked)">`;
  if(col.type==='person'||col.type==='label'){
    return `<span class="cellv" onclick="choiceMenu(event,'${it.id}','${col.id}')">${v?esc(v):'—'}</span>`;
  }
  if(col.type==='database'){
    const mode=col.options&&col.options.mode;
    if(mode==='mirror'){ // Etapa 3: espelho read-only de um campo do item conectado
      const md=mirrorDisp(it,col);
      return `<span class="cellv" style="color:#666;cursor:default;font-style:italic" title="Mirror (read-only) — reflects the connected item">${md!==''?esc(md):'—'}</span>`;
    }
    if(mode==='connect'){ // Etapa 3: conexão a um item de outro board (guarda o uid, mostra o nome)
      const nm=connectName(it,col);
      return `<span class="cellv" onclick="connectMenu(event,'${it.id}','${col.id}')">${nm?esc(nm):'—'}</span>`;
    }
    return `<span class="cellv" onclick="dbMenu(event,'${it.id}','${col.id}')">${v?esc(v):'—'}</span>`;
  }
  if(col.type==='link')return v?`<a href="${esc(v)}" target="_blank" style="color:var(--accent)">🔗 link</a> <span class="cellv" style="min-width:12px" onclick="editCell(event,'${it.id}','${col.id}')">✎</span>`:`<span class="cellv" onclick="editCell(event,'${it.id}','${col.id}')"></span>`;
  if(col.type==='number'&&numPair()&&col.id===valueColId(it)&&liveKids(it).length){
    if(!it.col_values._manualSum){
      const ss=subSum(it);
      return `<span class="cellv" style="font-style:italic" title="Sum of the items below — click to type a manual value" onclick="forceManual(event,'${it.id}','${col.id}')">Σ ${esc(fmtMoney(ss!=null?ss:0))}</span>`;
    }
    // manual override on a node that has children: show value + a button to resume summing
    const mv=(v!==''&&v!=null)?fmtMoney(v):'—';
    return `<span class="cellv" title="Manual value — not summing the items below" onclick="editCell(event,'${it.id}','${col.id}')">${esc(mv)}</span> <button class="icon-btn" title="Resume summing from the items below" onclick="event.stopPropagation();resumeSum('${it.id}')">↺</button>`;
  }
  let disp=v??'';
  if(col.type==='number'&&v!==''&&v!=null)disp=fmtMoney(v);
  else if(col.type==='date'&&v)disp=fmtDateBR(v);
  return `<span class="cellv" onclick="editCell(event,'${it.id}','${col.id}')">${esc(disp)}</span>`;
}
function statusMenu(e,itemId,colId){
  const col=cols.find(c=>c.id===colId);
  menu(e,(col.options.labels||[]).map(l=>['●'+l.name,()=>setCell(itemId,colId,l.name),l.color]).concat([['— clear',()=>setCell(itemId,colId,'')]]));

function editCell(e,itemId,colId){
  e.stopPropagation();

function choiceMenu(e,itemId,colId){
  e.stopPropagation();
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const col=cols.find(c=>c.id===colId);
  const m=document.createElement('div');m.className='menu';m.style.minWidth='210px';

  const list=document.createElement('div');list.style.maxHeight='220px';list.style.overflow='auto';list.style.display='flex';list.style.flexDirection='column';
  m.appendChild(inp);m.appendChild(list);
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();

      list.appendChild(b);
    }
    const clr=document.createElement('button');clr.textContent='— clear';clr.className='danger';
    clr.onclick=()=>{close();setCell(itemId,colId,'')};list.appendChild(clr);
  };
  const closer=ev=>{if(!m.contains(ev.target))close()};
  const close=()=>{m.remove();document.removeEventListener('mousedown',closer)};
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const first=list.querySelector('button');if(first)first.click()}if(ev.key==='Escape')close()});
  draw();
  document.body.appendChild(m);
  m.style.left=Math.min(e.clientX,innerWidth-230)+'px';
  m.style.top=Math.min(e.clientY,innerHeight-290)+'px';
  inp.focus();
  setTimeout(()=>document.addEventListener('mousedown',closer));
}

/* ---- TABLE ---- */
function renderTable(){
  if(isProjectBoard())return renderProjectTable(); // B1
  const ic=itemCols(),sc=subCols();
  let html='';
  for(const g of groups){
    const gi=topItems().filter(x=>x.group_id===g.id&&itemVisible(x)).sort((a,b)=>(a.position||0)-(b.position||0));
    const isCol=collapsed[g.id];
    // sums (uses effective value: subitem sum or manual)
    const sums=ic.filter(c=>c.type==='number').map(c=>{
      const t=gi.filter(x=>!isPending(x)).reduce((s,it)=>s+effNum(it,c),0);
      return {c,t};
    });
    const W=colW();
    html+=`<div class="group">
      <div class="group-head">
        <input type="checkbox" class="selbox" title="Select all items in this group" ${groupAllSelected(g.id)?'checked':''} onclick="event.stopPropagation();toggleGroupSel('${g.id}',this.checked)">
        <h3 style="color:${g.color}" onclick="collapsed['${g.id}']=!collapsed['${g.id}'];renderView()">${isCol?'▸':'▾'} ${esc(g.name)}</h3>

      </div>`;
    if(!isCol){
      // table-layout:fixed only works with an explicit table width → sum the column widths
      const tw=(W.name||300)+ic.reduce((t,c)=>t+(W[c.id]||140),0)+40;
      const sw=(W.s_name||260)+sc.reduce((t,c)=>t+(W['s_'+c.id]||140),0)+40;
      html+=`<table class="gtable" style="table-layout:fixed;width:${tw}px"><tr><th style="width:${W.name||300}px;position:relative">Item<span class="rz" onmousedown="rzStart(event,'name')"></span></th>${ic.map(c=>`<th style="width:${W[c.id]||140}px;position:relative">${esc(c.name)}<span class="rz" onmousedown="rzStart(event,'${c.id}')"></span></th>`).join('')}<th style="width:40px"></th></tr>`;
      for(const it of gi){
        const subs=subsOf(it.id).slice().sort((a,b)=>(a.position||0)-(b.position||0));
        const shown=collapsed['x'+it.id]||subFiltersActive();
        if(isPending(it)){html+=ghostItemRow(it,ic,subs.length);continue}
        html+=`<tr class="item" ondragover="rowOver(event)" ondragleave="rowLeave(event)" ondrop="rowDrop(event,'${it.id}','item')"><td><div class="iname">
          <input type="checkbox" class="selbox" ${selected.has(it.id)?'checked':''} onclick="event.stopPropagation();toggleSel('${it.id}',this.checked)">
          <span class="drag" draggable="true" ondragstart="rowDragStart(event,'${it.id}','item')" ondragend="rowDragEnd(event)" title="Drag to reorder">⠿</span>
          <button class="exp" onclick="collapsed['x${it.id}']=!collapsed['x${it.id}'];renderView()">${subs.length?(shown?'▾':'▸'):'·'}</button>
          <span class="nm" data-nm="${it.id}" onclick="nmClick(event,'${it.id}')" ondblclick="startRename(event,'${it.id}')">${esc(it.name)}</span>
          <button class="nm-edit" title="Rename" onclick="startRename(event,'${it.id}')">✎</button>
          <button class="nm-edit" title="Add subitem" onclick="event.stopPropagation();promptAdd('${g.id}','${it.id}')">＋</button>
          ${subs.length?`<span class="small">${subs.length}</span>`:''}
        </div></td>
        ${ic.map(c=>`<td>${cellHtml(it,c)}</td>`).join('')}
        <td><button class="icon-btn" onclick="itemMenu(event,'${it.id}')">⋯</button></td></tr>`;
        if(shown){
          // subitems live in their own nested table → independent, resizable widths; N-level recursive
          html+=`<tr class="subwrap"><td colspan="${ic.length+2}">
            <table class="gtable subtable" style="table-layout:fixed;width:${sw}px">
            <tr><th style="width:${W.s_name||260}px;position:relative"><input type="checkbox" class="selbox" title="Select all subitems of this item" ${subtreeAllSelected(it.id)?'checked':''} onclick="event.stopPropagation();toggleSubtreeSel('${it.id}',this.checked)"> Subitem<span class="rz" onmousedown="rzStart(event,'s_name')"></span></th>
            ${sc.map(c=>`<th style="width:${W['s_'+c.id]||140}px;position:relative">${esc(c.name)}<span class="rz" onmousedown="rzStart(event,'s_${c.id}')"></span></th>`).join('')}

function rzStart(e,key){

let dragCtx=null, selected=new Set();
function rowDragStart(e,id,scope){dragCtx={id,scope};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id)}catch(_){}}
function rowDragEnd(e){dragCtx=null;document.querySelectorAll('.dragrow').forEach(r=>r.classList.remove('dragrow'))}
function rowOver(e){if(!dragCtx)return;e.preventDefault();const tr=e.currentTarget;document.querySelectorAll('.dragrow').forEach(r=>{if(r!==tr)r.classList.remove('dragrow')});tr.classList.add('dragrow')}
function rowLeave(e){e.currentTarget.classList.remove('dragrow')}
async function rowDrop(e,targetId,scope){
  e.preventDefault();e.stopPropagation();
  e.currentTarget.classList.remove('dragrow');
  const ctx=dragCtx;dragCtx=null;
  if(!ctx||ctx.scope!==scope||ctx.id===targetId)return;
  const dragged=items.find(x=>x.id===ctx.id),target=items.find(x=>x.id===targetId);
  if(!dragged||!target)return;
  if(scope==='sub'&&dragged.parent_id!==target.parent_id)return;  // subitems: reorder within same parent only
  let movedGroup=false;
  if(scope==='item'&&dragged.group_id!==target.group_id){         // drag an item into another group
    await moveItemToGroup(dragged,target.group_id,false);
    movedGroup=true;
  }
  const gid=movedGroup?target.group_id:dragged.group_id;
  const list=(scope==='item'?topItems().filter(x=>x.group_id===gid):subsOf(dragged.parent_id)).slice().sort((a,b)=>(a.position||0)-(b.position||0)).filter(x=>x.id!==dragged.id);
  const ti=list.findIndex(x=>x.id===target.id);
  list.splice(ti<0?list.length:ti,0,dragged);   // drop before the target row
  list.forEach((it,i)=>it.position=i);
  renderView();
  await Promise.all(list.map(it=>sb.from('items').update({position:it.position}).eq('id',it.id)));
}
async function groupDrop(e,gid){   // drop an item onto a group's "+ Add item" zone → move to end of that group
  e.preventDefault();e.stopPropagation();
  e.currentTarget.classList.remove('dragrow');
  const ctx=dragCtx;dragCtx=null;
  if(!ctx||ctx.scope!=='item')return;
  const dragged=items.find(x=>x.id===ctx.id);if(!dragged)return;
  if(dragged.group_id!==gid)await moveItemToGroup(dragged,gid,false);
  const list=topItems().filter(x=>x.group_id===gid&&x.id!==dragged.id).slice().sort((a,b)=>(a.position||0)-(b.position||0));
  list.push(dragged);list.forEach((it,i)=>it.position=i);
  renderView();
  await Promise.all(list.map(it=>sb.from('items').update({position:it.position}).eq('id',it.id)));
}
// move a top-level item (and its whole sub-tree) to another group
async function moveItemToGroup(it,gid,doRender){
  if(it.group_id===gid)return;
  const old=groupName(it.group_id);
  const ids=[it.id,...descendantIds(it.id)];
  it.group_id=gid;
  for(const d of descendantIds(it.id)){const c=items.find(x=>x.id===d);if(c)c.group_id=gid}
  await sb.from('items').update({group_id:gid}).in('id',ids);
  logActivity(it.id,'group',old,groupName(gid));
  if(doRender)renderView();
}

function aiDigestText(all){

function aiSchemaText(all){
  const lines=[];

    const dcol=scope=>bc.filter(c=>c.scope===scope).map(c=>{

      else if((c.type==='person'||c.type==='label')&&(c.options.choices||[]).length)d+='='+(c.options.choices||[]).join('/');
      else if(c.type==='database'&&c.options&&c.options.mode==='mirror')d+=' [somente leitura, NÃO preencher]';
      else if(c.type==='database'&&c.options&&c.options.source){
        const opts=all.its.filter(x=>x.board_id===c.options.source&&!x.parent_id&&!(x.col_values&&x.col_values._pending)).map(x=>x.name).filter(Boolean).slice(0,40);
        if(opts.length)d+='=vincula a um destes (use o nome EXATO): '+opts.join(' | ');
      }

    }).join(', ')||'(nenhuma)';

function aiParseActions(text){
  const m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(!m)return {actions:null, clean:text};
  try{
    const obj=JSON.parse(m[1].trim());
    const actions=Array.isArray(obj)?obj:((obj&&obj.actions)||null);
    return {actions, clean:text.replace(m[0],'').trim()};
  }catch(e){ return {actions:null, clean:text}; }
}
// resolve o texto proposto pela IA para o uid do item do board-fonte de uma coluna "connect"
function resolveConnectUid(src,text,all){
  const t=String(text==null?'':text).trim().toLowerCase();if(!t)return null;
  const norm=s=>String(s==null?'':s).trim().toLowerCase();
  const pool=(all.its||[]).filter(x=>x.board_id===src&&!x.parent_id&&!(x.col_values&&x.col_values._pending));
  let hit=pool.find(p=>norm(p.name)===t);if(hit)return String(hit.uid);
  const codeOf=s=>{const m=String(s).match(/(QL|PJ)\s*0*\d+/i);return m?m[0].replace(/\s+/g,'').toUpperCase():null};
  const tc=codeOf(text);if(tc){hit=pool.find(p=>{const pc=codeOf(p.name);return pc&&pc===tc});if(hit)return String(hit.uid);}
  hit=pool.find(p=>{const n=norm(p.name);return n&&(n.includes(t)||t.includes(n))});if(hit)return String(hit.uid);
  return null;
}
async function aiExecuteActions(actions,all){
  const res={items:0,subs:0,changes:0,comments:0,boards:new Set(),errors:[],created:[]};
  const nm=s=>(s==null?'':String(s)).trim().toLowerCase();
  for(const a of actions){
    try{
      const op=a.op||a.action;
      const board=all.bs.find(b=>nm(b.name)===nm(a.board));
      if(!board){res.errors.push('board inválido: '+a.board);continue}
      const bc=all.cs.filter(c=>c.board_id===board.id);
      const mv=(vals,scope)=>{const cv={_pending:true};for(const k in (vals||{})){const col=bc.find(c=>c.scope===scope&&nm(c.name)===nm(k));if(!col)continue;let val=vals[k];
        if(col.type==='database'&&col.options&&col.options.mode==='connect'&&col.options.source){const uid=resolveConnectUid(col.options.source,val,all);if(uid!=null)val=uid;}
        cv[col.id]=val;}return cv};
      if(op==='add_item'){
        const g=all.gs.find(x=>x.board_id===board.id&&nm(x.name)===nm(a.group));
        if(!g){res.errors.push('grupo inválido em '+board.name+': '+a.group);continue}
        const {data:ni,error}=await sb.from('items').insert({board_id:board.id,group_id:g.id,parent_id:null,name:a.name||'(sem nome)',col_values:mv(a.values,'item'),position:99999,created_by:'ai'}).select().single();
        if(error){res.errors.push(error.message);continue}
        res.items++;res.boards.add(board.name);res.created.push({id:ni.id,kind:'item',name:ni.name,board:board.name,attach:a.attach||[],links:a.links||[]});
        for(const su of (a.subitems||[])){const {data:sni,error:se}=await sb.from('items').insert({board_id:board.id,group_id:g.id,parent_id:ni.id,name:su.name||'(sub)',col_values:mv(su.values,'subitem'),position:99999,created_by:'ai'}).select().single();if(se)res.errors.push(se.message);else{res.subs++;res.created.push({id:sni.id,kind:'subitem',name:sni.name,board:board.name,attach:su.attach||[],links:su.links||[]})}}
      }else if(op==='add_subitem'){
        const par=all.its.find(x=>x.board_id===board.id&&!x.parent_id&&nm(x.name)===nm(a.parent));
        if(!par){res.errors.push('item-pai inválido em '+board.name+': '+a.parent);continue}
        const {data:sni,error}=await sb.from('items').insert({board_id:board.id,group_id:par.group_id,parent_id:par.id,name:a.name||'(sub)',col_values:mv(a.values,'subitem'),position:99999,created_by:'ai'}).select().single();
        if(error){res.errors.push(error.message);continue}
        res.subs++;res.boards.add(board.name);res.created.push({id:sni.id,kind:'subitem',name:sni.name,board:board.name,attach:a.attach||[],links:a.links||[]});
      }else if(op==='add_comment'){
        let target=null;
        if(a.subitem){const par=all.its.find(x=>x.board_id===board.id&&!x.parent_id&&nm(x.name)===nm(a.parent||a.item));if(par)target=all.its.find(x=>x.board_id===board.id&&x.parent_id===par.id&&nm(x.name)===nm(a.subitem));}
        else target=all.its.find(x=>x.board_id===board.id&&!x.parent_id&&nm(x.name)===nm(a.item||a.parent));
        if(!target){res.errors.push('alvo do comentário não encontrado em '+board.name+': '+(a.subitem||a.item||a.parent));continue}
        const cbody=[a.text||''].concat((a.links||[]).filter(Boolean)).filter(Boolean).join('\n').trim();
        if(!cbody){res.errors.push('comentário vazio');continue}
        const {error}=await sb.from('comments').insert({item_id:target.id,author:'ai',body:cbody});
        if(error){res.errors.push(error.message);continue}
        res.comments++;res.boards.add(board.name);
      }else if(op==='set_values'){
        let cand=all.its.filter(x=>x.board_id===board.id&&!x.parent_id&&nm(x.name)===nm(a.item));
        if(a.group){const g=all.gs.find(x=>x.board_id===board.id&&nm(x.name)===nm(a.group));if(g)cand=cand.filter(x=>x.group_id===g.id);}
        if(!cand.length){res.errors.push('item não encontrado em '+board.name+': '+a.item);continue}
        if(cand.length>1){res.errors.push('item ambíguo, informe o grupo: '+a.item);continue}
        const it=cand[0];const pp={...(it.col_values._proposed||{})};let any=false;
        for(const k in (a.values||{})){const col=bc.find(c=>c.scope==='item'&&nm(c.name)===nm(k));if(col){let val=a.values[k];if(col.type==='database'&&col.options&&col.options.mode==='connect'&&col.options.source){const uid=resolveConnectUid(col.options.source,val,all);if(uid!=null)val=uid;}pp[col.id]=val;any=true;}}
        if(!any){res.errors.push('nenhuma coluna válida para '+a.item);continue}
        const cv={...it.col_values,_proposed:pp};if(a.note)cv._proposed_note=a.note;
        const {error}=await sb.from('items').update({col_values:cv}).eq('id',it.id);
        if(error){res.errors.push(error.message);continue}
        it.col_values=cv;res.changes++;res.boards.add(board.name);
      }else res.errors.push('ação não suportada: '+op);
    }catch(e){res.errors.push(String(e))}
  }
  return res;
}
// Hidden FAQ (not shown in UI) — the Lunes Assistant reads this to answer "how do I…" questions, esp. for Project/Gantt boards.
const PROJECT_FAQ=`COMO USAR OS BOARDS DO TIPO PROJECT (visão de cronograma/Gantt):
- Visões do board Project: Gantt, Workload, Kanban e Calendar (botões no topo do board). A List (árvore de atividades) também mostra as atividades.
- Adicionar atividade: no Gantt, "+ Add activity" no fim da árvore; ou no menu de 3 pontos (⋮) de uma linha: "Add sub-element" (subitem) ou "Add element" (mesmo nível). A hierarquia é infinita (subitem de subitem).
- Editar em linha: clique no nome para renomear; clique nas células Person, Start, Finish, Effort ou Predecessors para editar direto na lista.
- Mover datas: arraste a barra no Gantt para mover início e fim juntos; arraste as pontas da barra para mudar só o início ou só o fim (altera a duração).
- Dependências (setas): arraste a partir da bolinha (○) de uma barra até outra barra; o lado onde soltar define o tipo. Tipos: FS/TI (término→início, padrão), SS/II (início→início), FF/TT (término→término), SF/IT (início→término). Clique numa seta para trocar o tipo ou excluir. Também dá para digitar na coluna Predecessors, ex.: "1FS; 10SS" (usa o ID/número da atividade).
- Marco (milestone): atividade de duração zero, desenhada como losango. Duplo-clique numa barra vira/desvira marco, ou marque "Milestone" no painel de detalhes.
- Reagendamento em cascata: ao mover uma atividade e isso quebrar dependências, aparece um preview com os afetados e avisos de Kickoff/Deadline; você escolhe "Push these" (empurrar), "Move only this" (mover só esta) ou cancelar. Nada muda sem confirmar.
- Caminho crítico: o botão "Critical path" destaca em vermelho as atividades e setas críticas e abre um resumo.
- Cores das barras: o seletor "Color" colore por Status ou por Person.
- Zoom do tempo: Day, Week ou Month.
- Configurações do projeto (engrenagem ⚙): Kickoff (data zero), Deadline, horas por dia, dias por semana, contar/sombrear fins de semana.
- Workload: carga por pessoa ao longo dos meses no formato alocado/disponível (vermelho = sobrecarga). Ajuste a dedicação de cada pessoa (horas por dia/semana/mês) e as variáveis globais na própria aba.
- Kanban: arraste os cards entre as colunas de Status para mudar o status.
- Calendar: navegação mês a mês pela data de início; clique num evento para abrir os detalhes.
- Painel de detalhes de uma atividade: campos ID, Person, Start, Finish, Effort, Milestone, Predecessors, colunas configuráveis, Comentários e Activity log. A engrenagem (⚙) do painel abre o editor de colunas (adicionar/renomear/excluir coluna, editar rótulos de status e opções de label).
- ID: cada atividade tem um número sequencial imutável, usado para referenciar predecessoras.
- Exportar PDF: use Imprimir (Ctrl+P) na aba Gantt (layout de impressão paisagem).`;

        if(r.subs)parts.push(r.subs+' subitem(ns)');
        if(r.changes)parts.push(r.changes+' alteração(ões) proposta(s)');
        msg='✅ Feito. Registrei '+parts.join(' e ')+' para aprovação. Vá na aba "AI Input" do board '+bl+' e aprove minha ação.';
        if(curBoard&&[...r.boards].some(n=>n===curBoard.name))await selectBoard(curBoard.id);
      }
      let att=0,cmt=0;const used=new Set();
      if(r.created&&r.created.length){
        for(const c of r.created){
          for(const nnum of (c.attach||[])){const idx=(parseInt(nnum,10)||0)-1;if(aiFiles[idx]){if(await aiUploadFileTo(idx,c.id)){att++;used.add(idx)}}}
          const links=(c.links||[]).filter(Boolean);
          if(links.length){if(await aiPostComment(c.id,links.join('\n')))cmt++;}
        }
      }
      // arquivos sem mapeamento: se só houver 1 alvo claro, anexa nele; senão avisa
      if(aiFiles.length){
        const unused=aiFiles.map((_,i)=>i).filter(i=>!used.has(i));
        if(unused.length){
          const subs=(r.created||[]).filter(c=>c.kind==='subitem');
          const tgt=(r.created&&r.created.length===1)?r.created[0]:(subs.length===1?subs[0]:null);
          if(tgt){for(const i of unused){if(await aiUploadFileTo(i,tgt.id))att++;}}
          else msg+=(msg?'\n':'')+'⚠️ '+unused.length+' arquivo(s) não foram mapeados a um subitem — reenvie dizendo a qual subitem cada um pertence.';
        }
      }
      if(att||cmt)msg+=(msg?'\n':'')+'📎 '+(att?att+' arquivo(s) anexado(s)':'')+(att&&cmt?' e ':'')+(cmt?cmt+' comentário(s) com link':'')+'.';
      if(r.comments)msg+=(msg?'\n':'')+'💬 '+r.comments+' comentário(s) adicionado(s).';
      if(r.errors.length)msg+=(msg?'\n':'')+'⚠️ Não consegui em alguns pontos: '+r.errors.slice(0,4).join('; ');
      if(msg)aiPush('bot',msg);
    }
    if(!parsed.clean&&!(parsed.actions&&parsed.actions.length))aiPush('bot','(sem resposta)');
    clearAiFiles();
  }catch(e){aiPopTyping();aiPush('bot','⚠️ Falha: '+e);clearAiFiles()}
}

async function batchDelete(){
  const ids=[...selected];if(!ids.length)return;
  if(!confirm('Delete '+ids.length+' selected item(s)? Subitems of selected items are also removed.'))return;
  const childIds=items.filter(x=>x.parent_id&&ids.includes(x.parent_id)&&!ids.includes(x.id)).map(x=>x.id);
  const all=[...new Set([...ids,...childIds])];
  const {error}=await sb.from('items').delete().in('id',all);
  if(error)return toast(error.message);
  items=items.filter(x=>!all.includes(x.id));
  selected.clear();renderView();toast(ids.length+' deleted');
}

function bmTab(t){

  const b=$('bmBody');const sel=items.filter(x=>selected.has(x.id));

async function batchMove(){
  const gid=$('bmGroup').value;const tops=items.filter(x=>selected.has(x.id)&&!x.parent_id);
  if(!tops.length)return toast('No top-level items selected');
  const g=groups.find(x=>x.id===gid);
  if(!confirm('Move '+tops.length+' item(s) to "'+(g?g.name:'?')+'"?'))return;
  let pos=topItems().filter(x=>x.group_id===gid).length;
  for(const it of tops){await moveItemToGroup(it,gid,false);it.position=pos++;await sb.from('items').update({position:it.position}).eq('id',it.id)}
  document.querySelector('.overlay')?.remove();
  selected.clear();renderView();toast('Moved '+tops.length+' item(s)');
}
async function batchDuplicate(){
  const sel=items.filter(x=>selected.has(x.id));
  if(!sel.length)return;
  if(!confirm('Duplicate '+sel.length+' row(s) with sub-elements?'))return;
  for(const it of sel){await cloneNode(it,it.group_id,it.parent_id,' (copy)')}
  document.querySelector('.overlay')?.remove();
  selected.clear();renderView();toast('Duplicated '+sel.length+' row(s)');
}
async function bmValueUI(){

async function batchApply(){
  const c=cols.find(x=>x.id===$('bmCol').value);
  if(c&&c.type==='database'&&c.options&&c.options.mode==='mirror')return toast('Mirror columns are read-only');
  if(!$('bmInput'))return toast('Configure this column first');
  const raw=$('bmInput')?.value??'';
  const targets=items.filter(x=>selected.has(x.id)&&((x.parent_id?'subitem':'item')===c.scope));
  if(!targets.length)return toast('No selected rows in this column scope');
  if(!confirm('Set '+c.name+' = "'+raw+'" on '+targets.length+' '+c.scope+'(s)?'))return;
  const val=c.type==='checkbox'?!!raw:raw;
  for(const it of targets){it.col_values={...it.col_values,[c.id]:val};await sb.from('items').update({col_values:it.col_values}).eq('id',it.id)}
  document.querySelector('.overlay')?.remove();
  renderView();toast('Applied to '+targets.length+' item(s)');
}

function groupMenu(e,gid){

// reorder groups in the table (persists sequential positions)
function moveGroup(gid,dir){
  const idx=groups.findIndex(x=>x.id===gid),j=idx+dir;
  if(idx<0||j<0||j>=groups.length)return;
  const arr=groups.slice();const[g]=arr.splice(idx,1);arr.splice(j,0,g);groups=arr;
  renderView();
  for(let k=0;k<groups.length;k++){if(groups[k].position!==k){groups[k].position=k;sb.from('groups').update({position:k}).eq('id',groups[k].id)}}
}

let calMonth=new Date();
function calDateCol(){
  const saved=curBoard.cdate&&curBoard.cdate!=='both'&&cols.find(c=>c.id===curBoard.cdate);
  return saved||cols.find(c=>c.type==='date'&&c.scope==='item')||cols.find(c=>c.type==='date');

// which date column applies to a given row in the current calendar mode
function calColFor(isSub){
  if(curBoard.cdate==='both')return cols.find(c=>c.type==='date'&&c.scope===(isSub?'subitem':'item'));
  return calDateCol();
}
function renderCalendar(){
  const both=curBoard.cdate==='both';
  const dcol=calDateCol();
  if(!dcol){$('content').innerHTML='<p class="small" style="margin-top:30px">Add a date column to use Calendar.</p>';return}
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),startDow=(first.getDay()+6)%7;
  const daysIn=new Date(y,m+1,0).getDate();
  const dateCols=cols.filter(c=>c.type==='date');
  let html=`<div id="calendar"><div class="calhead">
    <button class="btn sm ghost" onclick="calMonth=new Date(${y},${m-1},1);renderView()">‹</button>
    <h3>${calMonth.toLocaleString('en',{month:'long'})} ${y}</h3>
    <button class="btn sm ghost" onclick="calMonth=new Date(${y},${m+1},1);renderView()">›</button>
    <button class="btn sm ghost" onclick="calMonth=new Date();renderView()">Today</button>
    <span class="small">Date column:</span>
    <select onchange="curBoard.cdate=this.value;renderView()">${dateCols.map(c=>`<option value="${c.id}" ${!both&&c.id===dcol.id?'selected':''}>${esc(c.name)} (${c.scope})</option>`).join('')}<option value="both" ${both?'selected':''}>Both (item + subitem)</option></select>
  </div><div class="calgrid">`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>html+=`<div class="caldow">${d}</div>`);
  const pool=items.filter(it=>passFilter(it)&&!isPending(it));
  const today=todayStr();
  for(let cell=0;cell<Math.ceil((startDow+daysIn)/7)*7;cell++){
    const dnum=cell-startDow+1;
    if(dnum<1||dnum>daysIn){html+='<div class="calday dim"></div>';continue}
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(dnum).padStart(2,'0')}`;
    const evs=pool.filter(it=>{const c=calColFor(!!it.parent_id);return c&&it.col_values[c.id]===ds});
    html+=`<div class="calday ${ds===today?'today':''}" data-d="${ds}" onclick="calAdd(event,'${ds}')" style="cursor:pointer" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="cdrop(event)">
      <span class="dnum">${dnum}</span>
      ${evs.map(it=>{const g=groups.find(x=>x.id===it.group_id);return `<div class="calev" style="background:${g?g.color:'#579bfc'}" draggable="true" ondragstart="event.dataTransfer.setData('t','${it.id}')" onclick="event.stopPropagation();openPanel('${it.id}')" title="${esc(it.name)}">${it.parent_id?'↳ ':''}${esc(it.name)}</div>`}).join('')}
    </div>`;
  }
  html+='</div></div>';
  $('content').innerHTML=html;
}
function cdrop(e){
  e.preventDefault();
  const el=e.currentTarget;el.classList.remove('dragover');
  const id=e.dataTransfer.getData('t');
  if(!id)return;
  const it=items.find(x=>x.id===id);
  const c=calColFor(!!(it&&it.parent_id));
  if(c)setCell(id,c.id,el.dataset.d);
}

/* ================= GENERIC MENU ================= */
let lastMenuEvent=null;
function menu(e,options){
  e.stopPropagation?.();lastMenuEvent=e;
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='menu';
  options.forEach(([label,fn,color])=>{
    const b=document.createElement('button');
    const danger=label.startsWith('!');
    b.textContent=danger?label.slice(1):label;
    if(danger)b.className='danger';
    if(color){b.style.color=color}
    b.onclick=()=>{m.remove();fn()};
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const x=Math.min(e.clientX||100,innerWidth-190),yy=Math.min(e.clientY||100,innerHeight-m.offsetHeight-10);
  m.style.left=x+'px';m.style.top=yy+'px';
  setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}));
}

/* ================= COLUMNS EDITOR ================= */
function openColumns(){
  overlay(`<h3>Columns — ${esc(curBoard.name)}</h3>
    <div class="tabs" style="align-self:flex-start"><button id="ct-item" class="active" onclick="colTab('item')">Item columns</button><button id="ct-subitem" onclick="colTab('subitem')">Subitem columns</button></div>
    <div id="colList"></div>
    <hr><div class="row">
      <input id="ncName" placeholder="Column name" style="flex:1">
      <select id="ncType"><option>text</option><option>number</option><option>date</option><option>status</option><option>person</option><option>label</option><option>link</option><option>checkbox</option><option>database</option><option>connect</option><option>mirror</option></select>
      <button class="btn sm" onclick="addColumn()">Add</button>
    </div>`);
  window._colScope='item';renderColList();
}
function colTab(s){window._colScope=s;$('ct-item').classList.toggle('active',s==='item');$('ct-subitem').classList.toggle('active',s==='subitem');renderColList()}
function renderColList(){
  const list=cols.filter(c=>c.scope===window._colScope);
  $('colList').innerHTML=list.map(c=>`<div class="autorule"><span><b>${esc(c.name)}</b> <span class="small">${c.type}</span>
    ${c.type==='status'?`<div class="chips" style="margin-top:6px">${(c.options.labels||[]).map((l,i)=>`<span class="chip" style="background:${l.color}22;color:${l.color}">
      <button title="change color" onclick="labelColor('${c.id}',${i})" style="opacity:1">●</button>
      <span style="cursor:pointer" title="rename" onclick="renameLabel('${c.id}',${i})">${esc(l.name)}</span>
      <button title="move left" onclick="moveLabel('${c.id}',${i},-1)">‹</button><button title="move right" onclick="moveLabel('${c.id}',${i},1)">›</button>
      <button title="delete" onclick="delLabel('${c.id}',${i})">✕</button></span>`).join('')}
      <button class="btn sm ghost" onclick="addLabel('${c.id}')">+ label</button>
      <span class="small" style="width:100%">label order = kanban column order</span></div>`:''}
    ${(c.type==='person'||c.type==='label')?`<div class="chips" style="margin-top:6px">${(c.options.choices||[]).map((ch,i)=>`<span class="chip">${esc(ch)}<button onclick="delChoice('${c.id}',${i})">✕</button></span>`).join('')}<button class="btn sm ghost" onclick="addChoice('${c.id}')">+ add</button></div>`:''}
    ${c.type==='database'?`<div class="chips" style="margin-top:6px"><span class="small">${dbColInfo(c)}</span><button class="btn sm ghost" onclick="${c.options&&c.options.mode==='mirror'?'configMirrorColumn':'configDbColumn'}('${c.id}')">⚙ Configure</button></div>`:''}
    </span>
    <span style="white-space:nowrap"><button class="icon-btn" title="move up" onclick="moveCol('${c.id}',-1)">↑</button><button class="icon-btn" title="move down" onclick="moveCol('${c.id}',1)">↓</button><button class="icon-btn" title="rename" onclick="renameCol('${c.id}')">✎</button><button class="icon-btn" style="color:var(--danger)" title="delete" onclick="delCol('${c.id}')">🗑</button></span></div>`).join('')||'<p class="small">No columns.</p>';
}
async function moveCol(id,dir){
  const list=cols.filter(c=>c.scope===window._colScope);
  list.forEach((c,i)=>c.position=i);
  const i=list.findIndex(c=>c.id===id),j=i+dir;
  if(j<0||j>=list.length)return;
  [list[i].position,list[j].position]=[list[j].position,list[i].position];
  await Promise.all(list.map(c=>sb.from('board_columns').update({position:c.position}).eq('id',c.id)));
  cols.sort((a,b)=>(a.scope===b.scope)?a.position-b.position:0);
  renderColList();renderView();
}
async function saveColOpts(c){await sb.from('board_columns').update({options:c.options}).eq('id',c.id);renderColList();renderView()}
async function labelColor(colId,i){
  const c=cols.find(x=>x.id===colId);const l=c.options.labels[i];
  l.color=STATUS_COLORS[(STATUS_COLORS.indexOf(l.color)+1)%STATUS_COLORS.length];
  await saveColOpts(c);
}
async function moveLabel(colId,i,dir){
  const c=cols.find(x=>x.id===colId);const ls=c.options.labels;const j=i+dir;
  if(j<0||j>=ls.length)return;
  [ls[i],ls[j]]=[ls[j],ls[i]];
  await saveColOpts(c);
}
async function renameLabel(colId,i){
  const c=cols.find(x=>x.id===colId);const old=c.options.labels[i].name;
  const n=prompt('Label text:',old);if(!n||n===old)return;
  c.options.labels[i].name=n;
  await sb.from('board_columns').update({options:c.options}).eq('id',colId);
  const affected=items.filter(it=>it.col_values[colId]===old);
  for(const it of affected){it.col_values={...it.col_values,[colId]:n};await sb.from('items').update({col_values:it.col_values}).eq('id',it.id)}
  renderColList();renderView();
}
async function delChoice(colId,i){
  const c=cols.find(x=>x.id===colId);c.options.choices.splice(i,1);
  await saveColOpts(c);
}
async function addChoice(colId){
  const c=cols.find(x=>x.id===colId);const n=prompt('New option:');if(!n)return;
  c.options={...c.options,choices:[...(c.options.choices||[]),n.trim()]};
  await saveColOpts(c);
}
async function addColumn(){
  const name=$('ncName').value.trim();if(!name)return;
  const sel=$('ncType').value;
  // Etapa 3: connect/mirror são armazenados como type='database' (sem nova CHECK constraint) via options.mode
  let type=sel, options={};
  if(sel==='status')options={labels:[{name:'To Do',color:'#c4c4c4'},{name:'Working on it',color:'#fdab3d'},{name:'Done',color:'#00c875'}]};
  else if(sel==='person'||sel==='label')options={choices:[]};
  else if(sel==='connect'){type='database';options={mode:'connect'};}
  else if(sel==='mirror'){type='database';options={mode:'mirror'};}
  const {data,error}=await sb.from('board_columns').insert({board_id:curBoard.id,scope:window._colScope,name,type,options,position:cols.filter(c=>c.scope===window._colScope).length}).select().single();
  if(error)return toast(error.message);
  cols.push(data);$('ncName').value='';renderColList();renderView();
  if(sel==='database'||sel==='connect')configDbColumn(data.id); // escolher board-fonte
  else if(sel==='mirror')configMirrorColumn(data.id);            // escolher conexão + campo
}

/* ================= DATABASE COLUMNS (Etapa 2 / Fase C.1) =================
   A `database` column pulls its dropdown values from another board ("Database | X").
   options = { source:<boardId>, field:'_name'|<colId>, fieldName?:<label> }.
   The cell stores the chosen value as TEXT (simple version to test the format;
   a later step can upgrade to storing the source item's uid for rename-safety). */
let dbCache={}; // boardId -> [{uid, val}] of the configured field (loaded on demand)
function dbBoardName(id){const b=boards.find(x=>x.id===id);return b?b.name:'(missing board)'}
function dbFieldName(opts){if(!opts||!opts.field)return 'Name';if(opts.field==='_name')return 'Name';return opts.fieldName||'(column)'}
async function configDbColumn(colId){
  const c=cols.find(x=>x.id===colId);if(!c)return;
  window._dbCfgCol=colId;
  const isConnect=c.options&&c.options.mode==='connect';
  // list candidate source boards (Database | * first, then the rest), excluding the current board
  const cand=boards.filter(b=>b.id!==curBoard.id).sort((a,b)=>(b.name.startsWith('Database')?1:0)-(a.name.startsWith('Database')?1:0));
  overlay(`<h3>${isConnect?'Connect':'Database'} column — ${esc(c.name)}</h3>
    <div class="row"><span class="small" style="width:90px">${isConnect?'Connect to':'Call board'}</span>
      <select id="dbSrc" onchange="dbLoadFields()"><option value="">— choose a board —</option>${cand.map(b=>`<option value="${b.id}" ${c.options.source===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
    ${isConnect?'':`<div class="row"><span class="small" style="width:90px">Show field</span>
      <select id="dbField"><option value="_name">Name</option></select></div>`}
    <p class="small">${isConnect?'Links each item to an item of that board (shows its Name). Add Mirror columns to bring its fields.':'The chosen field of that board becomes this column\'s dropdown.'}</p>
    <button class="btn sm" style="align-self:flex-start" onclick="saveDbColumn('${c.id}')">Save</button>`);
  if(!isConnect)await dbLoadFields();
}
async function dbLoadFields(){
  const sel=$('dbSrc');if(!sel)return;const bid=sel.value;const fsel=$('dbField');if(!fsel)return;
  const cur=cols.find(x=>x.id===window._dbCfgCol);
  let opts='<option value="_name">Name</option>';
  if(bid){
    const {data}=await sb.from('board_columns').select('*').eq('board_id',bid).eq('scope','item').order('position');
    for(const col of (data||[]))opts+=`<option value="${col.id}">${esc(col.name)}</option>`;
  }
  fsel.innerHTML=opts;
  if(cur&&cur.options&&cur.options.source===bid&&cur.options.field)fsel.value=cur.options.field;
}
async function saveDbColumn(colId){
  const c=cols.find(x=>x.id===colId);if(!c)return;
  const source=$('dbSrc').value||null;
  const fsel=$('dbField');const field=fsel?(fsel.value||'_name'):'_name';
  const fieldName=field==='_name'?'Name':(fsel&&fsel.options[fsel.selectedIndex]?fsel.options[fsel.selectedIndex].text:'');
  c.options={...c.options,source,field,fieldName};
  delete dbCache[source]; // force reload
  await sb.from('board_columns').update({options:c.options}).eq('id',colId);
  document.querySelector('.overlay')?.remove();
  await loadMirrorSources(); // Etapa 3: connect columns precisam do cache do board-fonte
  renderColList();renderView();
}
// load the configured field values from the source board (cached per board+field)
async function dbValues(col){
  const s=col.options&&col.options.source;if(!s)return [];
  const key=s+'|'+(col.options.field||'_name');
  if(dbCache[key])return dbCache[key];
  const {data}=await sb.from('items').select('*').eq('board_id',s).is('parent_id',null).order('position');
  const field=col.options.field||'_name';
  const list=(data||[]).filter(it=>!isPending(it)).map(it=>({uid:it.uid,val:field==='_name'?it.name:(it.col_values?.[field]??'')})).filter(o=>o.val!==''&&o.val!=null);
  dbCache[key]=list;return list;
}

/* ================= CONNECT + MIRROR (Etapa 3 / Fase C.2) =================
   Reaproveita type='database' (sem nova CHECK constraint) via options.mode:
   - mode:'connect' -> options={mode:'connect', source:<boardId>}. A célula guarda
     o UID do item-fonte (texto) e exibe o NOME dele. Escolha via connectMenu.
   - mode:'mirror'  -> options={mode:'mirror', connectCol:<colId>, field:'_name'|<srcColId>, fieldName}.
     Célula read-only: acha o item conectado (pela coluna connect) e mostra o campo
     escolhido do board-fonte. Reflete a fonte (recarregado a cada abertura do board). */
let mirrorSrc={}; // boardId -> { uid(str): item }  dos boards-fonte conectados
async function loadMirrorSources(){
  mirrorSrc={};
  const srcIds=[...new Set(cols.filter(c=>c.type==='database'&&c.options&&c.options.mode==='connect'&&c.options.source).map(c=>c.options.source))];
  for(const bid of srcIds){
    const {data}=await sb.from('items').select('*').eq('board_id',bid);
    const map={};(data||[]).forEach(it=>{map[String(it.uid)]=it});
    mirrorSrc[bid]=map;
  }
}
function connectSrcItem(it,connectCol){
  if(!connectCol||!connectCol.options)return null;
  const uid=it.col_values[connectCol.id];const src=connectCol.options.source;
  if(uid==null||uid===''||!src)return null;
  const m=mirrorSrc[src];return m?(m[String(uid)]||null):null;
}
function connectName(it,col){
  const uid=it.col_values[col.id];if(uid==null||uid==='')return '';
  const si=connectSrcItem(it,col);return si?si.name:('#'+uid);
}
function mirrorDisp(it,col){
  const cc=cols.find(c=>c.id===(col.options&&col.options.connectCol));
  const si=connectSrcItem(it,cc);if(!si)return '';
  const f=(col.options&&col.options.field)||'_name';
  const raw=f==='_name'?si.name:(si.col_values&&si.col_values[f]!=null?si.col_values[f]:'');
  return raw==null?'':String(raw);
}
async function connectMenu(e,itemId,colId){
  e.stopPropagation();
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const col=cols.find(c=>c.id===colId);
  if(!col.options||!col.options.source){toast('Configure this Connect column first (Columns → ⚙)');return}
  const m=document.createElement('div');m.className='menu';m.style.minWidth='240px';
  const inp=document.createElement('input');inp.placeholder='Find…';inp.style.margin='4px';
  const list=document.createElement('div');list.style.maxHeight='260px';list.style.overflow='auto';list.style.display='flex';list.style.flexDirection='column';
  m.appendChild(inp);m.appendChild(list);
  const vals=await dbValues({options:{source:col.options.source,field:'_name'}}); // [{uid,val=name}]
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();list.innerHTML='';
    vals.filter(o=>String(o.val).toLowerCase().includes(q)).slice(0,200).forEach(o=>{
      const b=document.createElement('button');b.textContent=o.val;b.onclick=()=>{close();setCell(itemId,colId,String(o.uid))};list.appendChild(b);
    });
    if(!vals.length){const p=document.createElement('div');p.className='small';p.style.padding='6px';p.textContent='Source board has no items yet.';list.appendChild(p)}
    const clr=document.createElement('button');clr.textContent='— clear';clr.className='danger';clr.onclick=()=>{close();setCell(itemId,colId,'')};list.appendChild(clr);
  };
  const closer=ev=>{if(!m.contains(ev.target))close()};
  const close=()=>{m.remove();document.removeEventListener('mousedown',closer)};
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=list.querySelector('button');if(f)f.click()}if(ev.key==='Escape')close()});
  draw();document.body.appendChild(m);
  const r=e.target.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-260)+'px';m.style.top=(r.bottom+4)+'px';
  setTimeout(()=>document.addEventListener('mousedown',closer),0);inp.focus();
}
function dbColInfo(c){
  const o=c.options||{};
  if(o.mode==='connect')return o.source?('connect → <b>'+esc(dbBoardName(o.source))+'</b>'):'<i>connect not configured</i>';
  if(o.mode==='mirror'){const cc=cols.find(x=>x.id===o.connectCol);return cc?('mirror of <b>'+esc(dbFieldName(o))+'</b> via <b>'+esc(cc.name)+'</b>'):'<i>mirror not configured</i>';}
  return o.source?('source: <b>'+esc(dbBoardName(o.source))+'</b> · field: <b>'+esc(dbFieldName(o))+'</b>'):'<i>not configured</i>';
}
async function configMirrorColumn(colId){
  const c=cols.find(x=>x.id===colId);if(!c)return;
  window._mirCfgCol=colId;
  const connects=cols.filter(x=>x.type==='database'&&x.options&&x.options.mode==='connect'&&x.scope===c.scope);
  overlay(`<h3>Mirror column — ${esc(c.name)}</h3>
    <div class="row"><span class="small" style="width:120px">Through connection</span>
      <select id="mirConn" onchange="mirLoadFields()"><option value="">— choose a connect column —</option>${connects.map(cc=>`<option value="${cc.id}" ${c.options.connectCol===cc.id?'selected':''}>${esc(cc.name)}</option>`).join('')}</select></div>
    <div class="row"><span class="small" style="width:120px">Mirror field</span>
      <select id="mirField"><option value="_name">Name</option></select></div>
    <p class="small">${connects.length?'Shows a field from the item connected through the chosen connection. Read-only; reflects the source.':'⚠ Create a Connect column on this board first.'}</p>
    <button class="btn sm" style="align-self:flex-start" onclick="saveMirrorColumn('${c.id}')">Save</button>`);
  await mirLoadFields();
}
async function mirLoadFields(){
  const sel=$('mirConn');if(!sel)return;const cc=cols.find(x=>x.id===sel.value);const fsel=$('mirField');if(!fsel)return;
  const cur=cols.find(x=>x.id===window._mirCfgCol);
  let opts='<option value="_name">Name</option>';
  if(cc&&cc.options&&cc.options.source){
    const {data}=await sb.from('board_columns').select('*').eq('board_id',cc.options.source).eq('scope','item').order('position');
    for(const col of (data||[]))opts+=`<option value="${col.id}">${esc(col.name)}</option>`;
  }
  fsel.innerHTML=opts;
  if(cur&&cur.options&&cur.options.field)fsel.value=cur.options.field;
}
async function saveMirrorColumn(colId){
  const c=cols.find(x=>x.id===colId);if(!c)return;
  const connectCol=$('mirConn').value||null;
  const fsel=$('mirField');const field=fsel?fsel.value:'_name';
  const fieldName=field==='_name'?'Name':(fsel&&fsel.options[fsel.selectedIndex]?fsel.options[fsel.selectedIndex].text:'');
  c.options={...c.options,mode:'mirror',connectCol,field,fieldName};
  await sb.from('board_columns').update({options:c.options}).eq('id',colId);
  document.querySelector('.overlay')?.remove();
  await loadMirrorSources();
  renderColList();renderView();
}
